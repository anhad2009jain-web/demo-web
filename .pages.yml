media:
  - name: studio_images
    label: Studio Images
    input: media
    output: /photo-studio/media
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe

content:

  # 1. WEBSITE SETTINGS
  - name: settings
    label: Website Settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: studio_name
        label: Studio Name
        type: string
        required: true

      - name: tagline
        label: Website Tagline
        type: string

      - name: logo
        label: Studio Logo
        type: image
        options:
          media: studio_images

      - name: phone
        label: Contact Number
        type: string

      - name: whatsapp
        label: WhatsApp Number
        type: string

      - name: email
        label: Email Address
        type: string

      - name: address
        label: Studio Address
        type: text

      - name: instagram
        label: Instagram Link
        type: string

      - name: facebook
        label: Facebook Link
        type: string

      - name: hero_title
        label: Homepage Main Heading
        type: string

      - name: hero_description
        label: Homepage Description
        type: text

      - name: hero_image
        label: Homepage Main Image
        type: image
        options:
          media: studio_images

  # 2. ABOUT SECTION
  - name: about
    label: About Studio
    type: file
    path: content/about.json
    format: json
    fields:
      - name: heading
        label: About Heading
        type: string

      - name: description
        label: About Description
        type: rich-text

      - name: story
        label: Studio Story
        type: rich-text

      - name: experience
        label: Years of Experience
        type: string

      - name: team_image
        label: Team Photograph
        type: image
        options:
          media: studio_images

  # 3. STUDIO TIMINGS
  - name: timings
    label: Studio Timings
    type: file
    path: content/timings.json
    format: json
    fields:
      - name: monday
        label: Monday
        type: string

      - name: tuesday
        label: Tuesday
        type: string

      - name: wednesday
        label: Wednesday
        type: string

      - name: thursday
        label: Thursday
        type: string

      - name: friday
        label: Friday
        type: string

      - name: saturday
        label: Saturday
        type: string

      - name: sunday
        label: Sunday
        type: string

      - name: holiday_notice
        label: Holiday Notice
        type: text

  # 4. GALLERY
  - name: gallery
    label: Gallery
    type: collection
    path: content/gallery
    format: json
    filename: "{primary}.json"
    fields:
      - name: title
        label: Photograph Title
        type: string
        required: true

      - name: image
        label: Upload Photograph
        type: image
        required: true
        options:
          media: studio_images

      - name: category
        label: Category
        type: select
        options:
          values:
            - Newborn
            - Maternity
            - Baby
            - Cake Smash
            - Family
            - Birthday
            - Other

      - name: description
        label: Image Description
        type: text

      - name: featured
        label: Show as Featured
        type: boolean

  # 5. CUSTOMER REVIEWS
  - name: reviews
    label: Customer Reviews
    type: collection
    path: content/reviews
    format: json
    filename: "{primary}.json"
    fields:
      - name: customer_name
        label: Customer Name
        type: string
        required: true

      - name: review
        label: Customer Feedback
        type: text
        required: true

      - name: rating
        label: Star Rating
        type: number
        required: true

      - name: date
        label: Review Date
        type: date

      - name: visible
        label: Display Review
        type: boolean

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "CMS: Create {path}"
      update: "CMS: Update {path}"
      delete: "CMS: Delete {path}"
      rename: "CMS: Rename {oldPath} to {newPath}"